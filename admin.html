
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LearnHub</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body data-page="admin">

    <header>
        <h2>LearnHub Admin</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="user.html">User</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <main class="container">
        <h1>Admin Dashboard</h1>
        <p>Manage the courses available on the platform.</p>

        <section class="form-box">
            <h2>Add New Course</h2>

            <form id="courseForm">
                <label for="courseName">Course Name</label>
                <input type="text" id="courseName"
                       placeholder="Enter course name" required>

                <label for="instructor">Instructor Name</label>
                <input type="text" id="instructor"
                       placeholder="Enter instructor name" required>

                <label for="price">Course Price (₹)</label>
                <input type="number" id="price"
                       placeholder="Enter price" min="0" required>

                <label for="duration">Course Duration</label>
                <input type="text" id="duration"
                       placeholder="Example: 4 weeks" required>

                <button type="submit" class="btn">
                    Add Course
                </button>
            </form>
            <p id="adminMessage" class="message"></p>
        </section>

        <section>
            <h2>Available Courses</h2>
            <p>Total Courses: <strong id="totalCourses">0</strong></p>
            <div id="adminCourseList" class="card-container"></div>
        </section>

        <a href="index.html" class="back-link">← Back to Home</a>
    </main>

    <footer>
        <p>LearnHub Admin Panel</p>
    </footer>

</body>
</html>
